<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Epilepsy Foundation HK - Be Aware n' Be Around</title>
    <style>
        :root {
            --primary-orange: #f57c00; 
            --light-orange: #ffe0b2;
            --dark-orange: #e65100;
            --bg: #fff9f5;
            --text: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            text-align: center;
        }
        .header {
            margin-bottom: 20px;
        }
        .logo-placeholder {
            background-color: var(--primary-orange);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
            display: inline-block;
            font-weight: bold;
        }
        h2 {
            color: var(--dark-orange);
            margin-top: 0;
        }
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 320px;
            border: 1px solid var(--light-orange);
        }
        .toggle-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        select, button.record-toggle {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        select {
            border-color: var(--primary-orange);
            color: var(--dark-orange);
            font-weight: bold;
        }
        button.record-toggle {
            background-color: #e0e0e0;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        button.record-toggle.active {
            background-color: #ffcc80;
            color: var(--dark-orange);
            border-color: var(--dark-orange);
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: var(--light-orange);
            padding: 20px;
            border-radius: 16px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-toy {
            width: 100px;
            height: 100px;
            border: none;
            border-radius: 12px;
            font-size: 32px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0,0,0,0.15);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            background-color: var(--primary-orange);
            -webkit-tap-highlight-color: transparent;
        }
        .btn-toy:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 rgba(0,0,0,0.15);
        }
        
        /* Animation for recording state */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.7); background-color: #d32f2f; }
            50% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(211, 47, 47, 0); background-color: #ff5252; }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(211, 47, 47, 0); background-color: #d32f2f; }
        }
        .recording-pulse {
            animation: pulse 1.5s infinite;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
            color: var(--dark-orange);
            height: 24px;
        }
        .help-text {
            font-size: 12px; 
            color: #666; 
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-placeholder">
            香港腦癇基金會<br>EPILEPSY FOUNDATION<br>OF HONG KONG
        </div>
        <h2>Be Aware n' Be Around</h2>
    </div>

    <div class="controls">
        <div class="toggle-group">
            <label for="modeSelect">應用模式：</label>
            <select id="modeSelect">
                <option value="edu" selected>教育模式</option>
                <option value="toy">玩具模式 (錄音/播放)</option>
            </select>
        </div>
        <button id="recordToggle" class="record-toggle" style="display: none;">錄音模式：關閉</button>
        <p id="helpText" class="help-text">
            在玩具模式下，開啟「錄音模式」，然後點擊按鍵進行錄音（最長60秒）。再次點擊停止。關閉「錄音模式」即可播放。
        </p>
    </div>

    <div class="grid">
        <button class="btn-toy" data-id="1">守</button>
        <button class="btn-toy" data-id="2">望</button>
        <button class="btn-toy" data-id="3">相</button>
        <button class="btn-toy" data-id="4">助</button>
    </div>

    <div id="status">教育模式：請點擊按鍵聆聽指示。</div>

    <!-- Hidden audio element for more reliable mobile playback -->
    <audio id="globalAudioPlayer" playsinline></audio>

    <script>
        let currentMode = 'edu'; 
        let isRecordModeActive = false;
        let isRecording = false;
        let mediaRecorder;
        let audioChunks = [];
        let currentRecordingId = null;
        let recordingTimeout;
        let supportedMimeType = '';

        const userAudio = { 1: null, 2: null, 3: null, 4: null };
        const globalAudioPlayer = document.getElementById('globalAudioPlayer');
        
        // Translated clinical instructions
        const eduContent = {
            1: "守。保持鎮定，記錄抽搐開始及持續的時間。",
            2: "望。觀察並保護患者。移開附近危險物品，用軟物墊著患者頭部。",
            3: "相。將患者輕輕翻側，保持呼吸道暢通。",
            4: "助。尋求協助。切勿強行將任何物品塞入患者口中。陪伴患者直至清醒，若抽搐超過五分鐘請召喚救護車。"
        };

        const modeSelect = document.getElementById('modeSelect');
        const recordToggle = document.getElementById('recordToggle');
        const statusDiv = document.getElementById('status');
        const helpText = document.getElementById('helpText');
        const buttons = document.querySelectorAll('.btn-toy');

        // Mode Switching
        modeSelect.addEventListener('change', (e) => {
            currentMode = e.target.value;
            if (currentMode === 'edu') {
                recordToggle.style.display = 'none';
                helpText.style.display = 'none';
                isRecordModeActive = false;
                recordToggle.classList.remove('active');
                recordToggle.innerText = "錄音模式：關閉";
                setStatus("教育模式：請點擊按鍵聆聽指示。");
            } else {
                recordToggle.style.display = 'block';
                helpText.style.display = 'block';
                setStatus("玩具模式：準備就緒。");
            }
        });

        // Toggle Recording Status
        recordToggle.addEventListener('click', async () => {
            if (!isRecordModeActive) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    setupMediaRecorder(stream);
                    isRecordModeActive = true;
                    recordToggle.classList.add('active');
                    recordToggle.innerText = "錄音模式：開啟 (請點擊按鍵)";
                    setStatus("準備錄音。");
                } catch (err) {
                    alert("需要麥克風權限才能進行錄音。");
                    console.error(err);
                }
            } else {
                isRecordModeActive = false;
                recordToggle.classList.remove('active');
                recordToggle.innerText = "錄音模式：關閉";
                if(isRecording) stopRecording(currentRecordingId);
                setStatus("播放模式：開啟。");
            }
        });

        // Setup Media Recorder with Cross-Browser MIME type detection
        function setupMediaRecorder(stream) {
            const types = ['audio/webm', 'audio/mp4', 'audio/ogg', ''];
            for (let i = 0; i < types.length; i++) {
                if (types[i] === '' || MediaRecorder.isTypeSupported(types[i])) {
                    supportedMimeType = types[i];
                    break;
                }
            }
            
            const options = supportedMimeType ? { mimeType: supportedMimeType } : undefined;
            mediaRecorder = new MediaRecorder(stream, options);
            
            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/mp4' }); 
                const audioUrl = URL.createObjectURL(audioBlob);
                userAudio[currentRecordingId] = audioUrl;
                audioChunks = [];
                setStatus(`已儲存至按鍵 ${currentRecordingId}。`);
                isRecording = false;
                
                // Remove animation
                document.querySelector(`[data-id="${currentRecordingId}"]`).classList.remove('recording-pulse');
            };
        }

        // Handle button clicks
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                const id = btn.getAttribute('data-id');

                if (currentMode === 'edu') {
                    playEducationTTS(id);
                } else if (currentMode === 'toy') {
                    if (isRecordModeActive) {
                        handleRecording(id, btn);
                    } else {
                        playUserAudio(id);
                    }
                }
            });
        });

        function playEducationTTS(id) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(eduContent[id]);
            utterance.lang = 'zh-HK'; // Cantonese voice
            window.speechSynthesis.speak(utterance);
            setStatus(`播放教育步驟 ${id}...`);
        }

        function handleRecording(id, btnElement) {
            if (isRecording && currentRecordingId === id) {
                stopRecording(id);
            } else if (!isRecording) {
                audioChunks = [];
                currentRecordingId = id;
                mediaRecorder.start();
                isRecording = true;
                
                // Add animation
                btnElement.classList.add('recording-pulse');
                setStatus(`正在按鍵 ${id} 錄音... (最長60秒)`);
                
                recordingTimeout = setTimeout(() => {
                    if (mediaRecorder.state === "recording") {
                        stopRecording(id);
                        setStatus(`已達時間上限。已儲存至按鍵 ${id}。`);
                    }
                }, 60000);
            } else {
                setStatus("請先停止目前的錄音！");
            }
        }

        function stopRecording(id) {
            mediaRecorder.stop();
            clearTimeout(recordingTimeout);
            document.querySelector(`[data-id="${id}"]`).classList.remove('recording-pulse');
        }

        function playUserAudio(id) {
            if (userAudio[id]) {
                globalAudioPlayer.src = userAudio[id];
                globalAudioPlayer.play().catch(error => {
                    console.error("Playback failed:", error);
                    setStatus("播放失敗，請確保手機未靜音並調高音量。");
                });
                setStatus(`播放按鍵 ${id}...`);
            } else {
                setStatus("此按鍵尚未有錄音。");
            }
        }

        function setStatus(msg) {
            statusDiv.innerText = msg;
        }
    </script>
</body>
</html>
